<!DOCTYPE html>
<html>
<head>
<title>game phuong mai</title>
<style>
* { margin: 0; padding: 0; overflow: hidden; }
body { background: #000; }
canvas { display: block; pointer-events: none; }
#coords { position: fixed; top: 10px; left: 10px; color: white; font-family: monospace; font-size: 16px; background: rgba(0,0,0,0.5); padding: 5px 10px; pointer-events: none; display: none;}
#musicBtn, #feedbackBtn { position: fixed; bottom: 20px; left: 20px; padding: 10px 15px; background: rgba(0,0,0,0.7); color: white; border: 2px solid white; border-radius: 5px; cursor: pointer; font-size: 14px; z-index: 1000; transition: background 0.3s; pointer-events: auto; }
#musicBtn:hover, #feedbackBtn:hover { background: rgba(255,255,255,0.2); }
#musicBtn { bottom: 70px; }
#feedbackBtn { bottom: 20px; }
</style>
</head>
<body>
<div id="coords">X: 0, Y: 0</div>
<button id="musicBtn">🔊 Music ON</button>
<button id="feedbackBtn">📝 Feedback Form</button>
<canvas id="common_area"></canvas>
<script>
const canvas = document.getElementById('common_area');
const ctx = canvas.getContext('2d');
const coords = document.getElementById('coords');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

// Image and asset loading
const bg = new Image();
const char = new Image();

// walking frames: right-facing (1-3) and left-facing (4-6)
const walk1 = new Image();
const walk2 = new Image();
const walk3 = new Image();
const walk4 = new Image();
const walk5 = new Image();
const walk6 = new Image();
const walkRightFrames = [walk1, walk2, walk3];
const walkLeftFrames = [walk4, walk5, walk6];

let assetsLoaded = 0;
const assetsToLoad = 8; // bg + char + 6 walk frames
function checkStart() {
  assetsLoaded++;
  if (assetsLoaded === assetsToLoad) {
    // seed loop with a timestamp
    requestAnimationFrame(loop);
  }
}

bg.onload = checkStart;
char.onload = checkStart;
walk1.onload = checkStart;
walk2.onload = checkStart;
walk3.onload = checkStart;
walk4.onload = checkStart;
walk5.onload = checkStart;
walk6.onload = checkStart;

bg.src = 'background/common_area.png';
char.src = 'character/char.png';
walk1.src = 'character/char1.png';
walk2.src = 'character/char2.png';
walk3.src = 'character/char3.png';
walk4.src = 'character/char4.png';
walk5.src = 'character/char5.png';
walk6.src = 'character/char6.png';

// Player and input 
const player = { x: 700, y: 600, w: 100, h: 150, speed: 6 };
// Animation state for walking frames
let animIndex = 0;
let animTimer = 0; // ms
const animInterval = 120; // ms per frame
let isMoving = false;
let lastTime = 0;
let lastDirection = 'right'; // 'left' or 'right'
const keys = {};

// Obstacles
const table = { x: 1080, y: 430, w: 160, h: 100 };
const tree = { x: 670, y: 220, w: 100, h: 222 };
const piano = { x: 0, y: 520, w: 230, h: 90 };

// checkpoint area (table)
const checkpoint = { 
  x: 1080, y: 430, w: 160, h: 100,
  triggerDistance: 150 
};
let nearCheckpoint = false;

// Newsletter checkpoint
const newsletter = { x: 832, y: 691, triggerDistance: 100 };
let nearNewsletter = false;
let newsletterOpen = false;

// Preload newsletter image
const newsletterImg = new Image();
newsletterImg.src = 'asset/newsletter_c1.png';

// Music 
const bgMusic = new Audio('sound/bellrock.mp3');
bgMusic.loop = true;
bgMusic.volume = 0.5;
let isMusicEnabled = true;

// Start / retry music when player actually uses controls
document.addEventListener(
  'keydown',
  (e) => {
    // Only treat control keys as valid gestures
    if (!['w', 'a', 's', 'd', 'e', 'c', 'm'].includes(e.key)) return;

    if (bgMusic.paused && isMusicEnabled) {
      bgMusic.play().catch(err => {
        console.log('bgMusic play blocked:', err);
      });
    }
  },
  { capture: true }
);

// Music toggle button functionality
const musicBtn = document.getElementById('musicBtn');
musicBtn.addEventListener('click', () => {
  isMusicEnabled = !isMusicEnabled;
  if (isMusicEnabled) {
    bgMusic.play().catch(() => {});
    musicBtn.textContent = '🔊 Music ON';
  } else {
    bgMusic.pause();
    musicBtn.textContent = '🔇 Music OFF';
  }
});

// Feedback button functionality
const feedbackBtn = document.getElementById('feedbackBtn');
feedbackBtn.addEventListener('click', () => {
  window.open('https://docs.google.com/forms/d/e/1FAIpQLSflYPOSMXIHMsTg1yjtbUCtOVNrtUJV9_OQYcvg6fLb85r2NA/viewform', '_blank');
});

// Collision 
function collides(px, py) {
  // Block y < 80
  if (py < 80) return true;
  
  // Table collision
  if (px + player.w > table.x && px < table.x + table.w &&
      py + player.h > table.y && py < table.y + table.h) return true;
  
  // Tree collision
  if (px + player.w > tree.x && px < tree.x + tree.w &&
      py + player.h > tree.y && py < tree.y + tree.h) return true;

  // Piano collision
  if (px + player.w > piano.x && px < piano.x + piano.w &&
      py + player.h > piano.y && py < piano.y + piano.h) return true;

  return false;
}

// Check if near checkpoint
function checkCheckpoint() {
  const playerCenterX = player.x + player.w / 2;
  const playerCenterY = player.y + player.h / 2;
  const tableCenterX = checkpoint.x + checkpoint.w / 2;
  const tableCenterY = checkpoint.y + checkpoint.h / 2;
  
  const distance = Math.hypot(playerCenterX - tableCenterX, playerCenterY - tableCenterY);
  nearCheckpoint = distance < checkpoint.triggerDistance;

  // Check newsletter proximity
  const newsletterDist = Math.hypot(playerCenterX - newsletter.x, playerCenterY - newsletter.y);
  nearNewsletter = newsletterDist < newsletter.triggerDistance;
}

// Input handling 
document.addEventListener('keydown', e => {
  // Block arrow keys from scrolling / doing anything
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
    e.preventDefault();
    return;
  }
  keys[e.key] = true;
});

document.addEventListener('keyup', e => {
  keys[e.key] = false;
});

// Navigation and interaction
document.addEventListener('keydown', e => {
  if (e.key === 'c' && nearCheckpoint) {
    window.location.href = 'classroom1.html';  // Navigate to classroom1
  }
  if (e.key === 'm' && nearCheckpoint) {
    window.location.href = 'mks.html';  // Navigate to mks
  }
  if (e.key === 'e' && nearNewsletter) {
    newsletterOpen = !newsletterOpen;  // Toggle newsletter
  }
});

// Update loop 
function update(dt) {
  // dt in milliseconds
  let newX = player.x;
  let newY = player.y;

  if (keys['w']) newY -= player.speed;
  if (keys['s']) newY += player.speed;
  if (keys['a']) newX -= player.speed;
  if (keys['d']) newX += player.speed;

  if (!collides(newX, player.y)) player.x = newX;
  if (!collides(player.x, newY)) player.y = newY;

  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
  player.y = Math.max(0, Math.min(canvas.height - player.h, player.y));

  coords.textContent = `X: ${Math.round(player.x)}, Y: ${Math.round(player.y)}`;
  checkCheckpoint();

  // Animation update
  isMoving = !!(keys['w'] || keys['a'] || keys['s'] || keys['d']);
  // determine horizontal direction preference
  let horiz = lastDirection;
  if (keys['a'] && !keys['d']) horiz = 'left';
  else if (keys['d'] && !keys['a']) horiz = 'right';

  // reset anim when direction changes
  if (horiz !== lastDirection) {
    lastDirection = horiz;
    animIndex = 0;
    animTimer = 0;
  }

  const currentFrames = lastDirection === 'left' ? walkLeftFrames : walkRightFrames;

  if (isMoving) {
    animTimer += dt || 16;
    if (animTimer >= animInterval) {
      animTimer -= animInterval;
      animIndex = (animIndex + 1) % currentFrames.length;
    }
  } else {
    animIndex = 0;
    animTimer = 0;
  }
}

// Draw 
function draw() {
  ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
  // Draw character: walking frames when moving, default char when idle
  const framesToUse = lastDirection === 'left' ? walkLeftFrames : walkRightFrames;
  if (isMoving && framesToUse[animIndex] && framesToUse[animIndex].naturalWidth > 0) {
    ctx.drawImage(framesToUse[animIndex], player.x, player.y, player.w, player.h);
  } else {
    ctx.drawImage(char, player.x, player.y, player.w, player.h);
  }

  // Show prompt when near checkpoint
if (nearCheckpoint) {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(checkpoint.x, checkpoint.y - 70, 250, 60);
  ctx.fillStyle = 'white';
  ctx.font = '16px Arial';
  ctx.fillText('Press C to enter Classroom 1', checkpoint.x + 10, checkpoint.y - 45);
  ctx.fillText('Press M to enter Makerspace', checkpoint.x + 10, checkpoint.y - 25);
}

  // Show newsletter prompt when near
  if (nearNewsletter) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(player.x, player.y - 30, 260, 25);
    ctx.fillStyle = 'white';
    ctx.font = '14px Arial';
    ctx.fillText('Press E to read the newsletter', player.x + 10, player.y - 12);
  }

  // Draw newsletter modal if open
  if (newsletterOpen) {
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw preloaded newsletter image if available
    if (newsletterImg.width > 0) {
      const maxW = canvas.width * 0.8;
      const maxH = canvas.height * 0.8;
      let w = newsletterImg.width;
      let h = newsletterImg.height;
      
      if (w > maxW) {
        h = (h * maxW) / w;
        w = maxW;
      }
      if (h > maxH) {
        w = (w * maxH) / h;
        h = maxH;
      }
      
      const x = (canvas.width - w) / 2;
      const y = (canvas.height - h) / 2;
      ctx.drawImage(newsletterImg, x, y, w, h);
    }

    ctx.fillStyle = 'white';
    ctx.font = '14px Arial';
    ctx.fillText('Press E to close', 20, 40);
  }

  // Game instructions at bottom right
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(canvas.width - 270, canvas.height - 160, 300, 160);
  ctx.fillStyle = 'white';
  ctx.font = '12px Arial';
  

  ctx.fillText('Use W(UP), A(LEFT), S(DOWN), D(RIGHT)', canvas.width - 260, canvas.height - 140);
  ctx.fillText('to move the character', canvas.width - 260, canvas.height - 125);
  
  
  ctx.fillText('The checkpoint to enter a new map is', canvas.width - 260, canvas.height - 110);
  ctx.fillText('located at the table.', canvas.width - 260, canvas.height - 95);
  

  ctx.fillText('In each new map, you can explore and', canvas.width - 260, canvas.height - 80);
  ctx.fillText('discover new things by yourself', canvas.width - 260, canvas.height - 65);
  

  ctx.fillText('The game is still updating', canvas.width - 260, canvas.height - 50);
  ctx.fillText('so don\'t hesitate to give us feedback', canvas.width - 260, canvas.height - 35);
  

  ctx.fillText('We wish you a warm Christmas with', canvas.width - 260, canvas.height - 20);
  ctx.fillText('your loved ones <3', canvas.width - 260, canvas.height - 5);
}

// Main loop
function loop(now) {
  if (!lastTime) lastTime = now || performance.now();
  const dt = (now || performance.now()) - lastTime;
  lastTime = now || performance.now();

  update(dt);
  draw();
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
