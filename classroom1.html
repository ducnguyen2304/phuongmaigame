// Initialize third mini-game (2D shooter)
const SHOOTER_WIN_SCORE = 150; // Score needed to win
function initMiniGame3() {
  minigame3Started = true;
  minigame3Won = false;
  minigame3Lost = false;
  minigame3LoseReason = '';

  shooterSpawnTimer = 0;

  shooterShootCooldown = 0;

// Update shooter game logic
function updateShooterGame(dt) {
  if (!minigame3Started || minigame3Won || minigame3Lost) return;
  
  const dtSec = dt / 1000;
  
  // Update timer
  minigame3Timer -= dtSec;
  if (minigame3Timer <= 0) {
    minigame3Timer = 0;
    // Check if player reached the goal
    if (minigame3Score >= SHOOTER_WIN_SCORE) {
      minigame3Won = true;
    } else {
      minigame3Lost = true;
      minigame3LoseReason = 'timeout'; // Time's up and didn't reach goal
    }
    return;
  }
  
  // Player movement
  const moveSpeed = 300; // pixels per second
  if (shooterKeys.left) shooterX -= moveSpeed * dtSec;
  if (shooterKeys.right) shooterX += moveSpeed * dtSec;
  
  // Keep player in bounds (game area is 750 wide, player is 70 wide)
  if (shooterX < 0) shooterX = 0;
  if (shooterX > 680) shooterX = 680;
  
  // Shoot cooldown
  if (!shooterCanShoot) {
    shooterShootCooldown -= dtSec;
    if (shooterShootCooldown <= 0) {
      shooterCanShoot = true;
    }
  }
  
  // Update bullets
  for (let i = shooterBullets.length - 1; i >= 0; i--) {
    shooterBullets[i].y -= 400 * dtSec; // bullet speed
    if (shooterBullets[i].y < -30) {
      shooterBullets.splice(i, 1);
    }
  }
  
  // Spawn targets
  shooterSpawnTimer -= dtSec;
  if (shooterSpawnTimer <= 0) {
    const isHazard = Math.random() < 0.25; // 25% chance of hazard
    shooterTargets.push({
      x: Math.random() * 680,
      y: -40,
      type: isHazard ? 'hazard' : 'target'
    });
    shooterSpawnTimer = 0.8 + Math.random() * 0.5; // spawn every 0.8-1.3 seconds
  }
  
  // Update targets (fall down)
  for (let i = shooterTargets.length - 1; i >= 0; i--) {
    shooterTargets[i].y += 120 * dtSec; // fall speed
    
    // Remove if off screen - no penalty for missing targets
    if (shooterTargets[i].y > 580) {
      shooterTargets.splice(i, 1);
    }
  }
  
  // Check bullet-target collisions
  for (let b = shooterBullets.length - 1; b >= 0; b--) {
    for (let t = shooterTargets.length - 1; t >= 0; t--) {
      const bx = shooterBullets[b].x;
      const by = shooterBullets[b].y;
      const tx = shooterTargets[t].x;
      const ty = shooterTargets[t].y;
      
      // Simple collision check (40x40 hitboxes)
      if (bx < tx + 40 && bx + 20 > tx && by < ty + 40 && by + 30 > ty) {
        // Hit!
        if (shooterTargets[t].type === 'target') {
          minigame3Score += 10;
          // Play electric hit sound (cut short after 300ms)
          electricHitSound.currentTime = 0;
          electricHitSound.play().catch(() => {});
          setTimeout(() => {
            electricHitSound.pause();
            electricHitSound.currentTime = 0;
          }, 300);
          // Check win condition immediately
          if (minigame3Score >= SHOOTER_WIN_SCORE) {
            minigame3Won = true;
          }
        } else {
          // Hit police - IMMEDIATE LOSS
          minigame3Lost = true;
          minigame3LoseReason = 'police';
        }
        shooterBullets.splice(b, 1);
        shooterTargets.splice(t, 1);
        break;
      }
    }
  }
  
  // Lose condition: time runs out before reaching target score
  if (minigame3Timer <= 0 && minigame3Score < SHOOTER_WIN_SCORE) {
    minigame3Lost = true;
  }
}

// Detect when player is close enough to checkpoints
function checkCheckpoints() {
  const pcx = player.x + player.w / 2;
  const pcy = player.y + player.h / 2;

  nearCheckpoint = null;
  nearTobias = false;
  nearSpeed = false;
  nearMu = false;
  nearLinhhuynh = false;
  nearLan = false;
  nearNathan = false;
  nearTobiasCheckpoint = false;
  nearMiniGameCheckpoint = false;

  // Check Jack checkpoint
  checkpoints.forEach(cp => {
    const dist = Math.hypot(pcx - (cp.x + cp.w/2), pcy - (cp.y + cp.h/2));

    if (dist < cp.triggerDistance && !cp.played) {
      nearCheckpoint = cp;
    } else if (dist >= cp.triggerDistance) {
      cp.played = false;
    }
  });

  // Check Tobias checkpoint
  const tobiasDist = Math.hypot(pcx - tobiasBurger.x, pcy - tobiasBurger.y);
  if (tobiasDist < tobiasBurger.triggerDistance && !tobiasBurger.played) {
    nearTobias = true;
  } else if (tobiasDist >= tobiasBurger.triggerDistance) {
    tobiasBurger.played = false;
  }

  // Check Speed checkpoint
  const speedDist = Math.hypot(pcx - SPpeedSound.x, pcy - SPpeedSound.y);
  if (speedDist < SPpeedSound.triggerDistance && !SPpeedSound.played) {
    nearSpeed = true;
  } else if (speedDist >= SPpeedSound.triggerDistance) {
    SPpeedSound.played = false;
  }

  // Check Mu checkpoint
  const muDist = Math.hypot(pcx - muSound.x, pcy - muSound.y);
  if (muDist < muSound.triggerDistance && !muSound.played) {
    nearMu = true;
  } else if (muDist >= muSound.triggerDistance) {
    muSound.played = false;
  }

  // Check Linh Huynh checkpoint
  const linhhuyhnhDist = Math.hypot(pcx - linhhuynh.x, pcy - linhhuynh.y);
  if (linhhuyhnhDist < linhhuynh.triggerDistance) {
    nearLinhhuynh = true;
  } else {
    nearLinhhuynh = false;
  }

  // Check Lan checkpoint
  const lanDist = Math.hypot(pcx - lan.x, pcy - lan.y);
  if (lanDist < lan.triggerDistance) {
    nearLan = true;
  } else {
    nearLan = false;
  }

  // Check Nathan checkpoint
  const nathanDist = Math.hypot(pcx - nathan.x, pcy - nathan.y);
  if (nathanDist < nathan.triggerDistance) {
    nearNathan = true;
  } else {
    nearNathan = false;
  }

  // Check Tobias checkpoint
  const tobiasDist2 = Math.hypot(pcx - tobiasCheckpoint.x, pcy - tobiasCheckpoint.y);
  if (tobiasDist2 < tobiasCheckpoint.triggerDistance) {
    nearTobiasCheckpoint = true;
  } else {
    nearTobiasCheckpoint = false;
  }

  // Check T1 checkpoint
  const t1Dist = Math.hypot(pcx - t1.x, pcy - t1.y);
  if (t1Dist < t1.triggerDistance && !t1.played) {
    nearT1 = true;
  } else if (t1Dist >= t1.triggerDistance) {
    t1.played = false;
    nearT1 = false;
  }

  // Check combined mini-game checkpoint
  const miniGameDist = Math.hypot(pcx - miniGameCheckpoint.x, pcy - miniGameCheckpoint.y);
  if (miniGameDist < miniGameCheckpoint.triggerDistance) {
    nearMiniGameCheckpoint = true;
  } else {
    nearMiniGameCheckpoint = false;
  }
}

// helper to pause bgMusic while a checkpoint sound plays, then resume once
let _bgResumeHandler = null;
function playCheckpointSound(sound) {
  // Stop any previously playing checkpoint sound
  if (currentCheckpointSound && !currentCheckpointSound.paused) {
    try {
      currentCheckpointSound.pause();
      currentCheckpointSound.currentTime = 0;
    } catch (e) {}
  }

  // Pause background music if needed
  const bgWasPlaying = !bgMusic.paused && !bgMusic.ended;
  if (bgWasPlaying) {
    try { bgMusic.pause(); } catch (e) {}
  }

  // Play the new checkpoint sound
  currentCheckpointSound = sound;
  try {
    sound.currentTime = 0;
  } catch (e) {}

    // Respect a preferred volume on the sound object if present, otherwise use 0.8
    try {
      sound.volume = (typeof sound._preferredVolume === 'number') ? sound._preferredVolume : 0.8;
    } catch (e) {}

  sound.play().catch(() => {});

  // Resume background music when checkpoint sound ends
  sound.onended = () => {
    currentCheckpointSound = null;
    if (musicStarted) {
      bgMusic.play().catch(() => {});
    }
  };
}

      t1.played = true;
    }
  }

  if (interactionKey === 'e') {
    // Mini-game 2 (Kera Candy Balance) - from combined checkpoint
    if (nearMiniGameCheckpoint && !minigame2Open && !minigameOpen && !minigame3Open) {
      minigame2Open = true;
      initMiniGame2();
    } else if (minigame2Open) {
      minigame2Open = false;
      minigame2Started = false;
    }
    // Also allow E to close minigame 1
    else if (minigameOpen) {
      minigameOpen = false;
      minigameStarted = false;
    }
    // Also allow E to close minigame 3
    else if (minigame3Open) {
      minigame3Open = false;
      minigame3Started = false;
      minigame3ShowingInstructions = true;
      shooterKeys = { left: false, right: false };
    }
  }

  // Mini-game 1 (Assignment shortcuts) - Q key from combined checkpoint
  if (interactionKey === 'q') {
    if (nearMiniGameCheckpoint && !minigameOpen && !minigame2Open && !minigame3Open) {
      minigameOpen = true;
      initMiniGame();
    } else if (minigameOpen) {
      minigameOpen = false;
      minigameStarted = false;
    }
  }

  // Retry mini-game with T key
  if (interactionKey === 't') {
    if (minigameOpen && (minigameWon || minigameLost)) initMiniGame();
    if (minigame2Open && (minigame2Won || minigame2Lost)) initMiniGame2();
  }

  // Handle mini-game keyboard shortcuts
  if (minigameOpen && minigameStarted && !minigameWon && !minigameLost) {
    let pressedShortcut = null;

    if (e.ctrlKey) {
      if (interactionKey === 'c') pressedShortcut = 'Ctrl+C';
      else if (interactionKey === 'v') pressedShortcut = 'Ctrl+V';
    }

    if (pressedShortcut) {
      // Check if it matches the next expected shortcut
      if (pressedShortcut === minigameSequence[playerInput.length]) {
        playerInput.push(pressedShortcut);

        // Check if player completed the sequence
        if (playerInput.length === minigameSequence.length) {
          minigameWon = true;
        }
      } else {
        // Wrong shortcut - lose
        minigameLost = true;
      }
    }
  }

  // Second mini-game input: Spacebar to stabilize
  if (minigame2Open && minigame2Started && !minigame2Won && !minigame2Lost && !stabStopped) {
    if (interactionKey === ' ' || e.code === 'Space') {
      e.preventDefault();
      stabStopped = true;
      // Check if within safe zone
      if (stabBarX >= stabSafeZoneStart && stabBarX <= stabSafeZoneEnd) {
        minigame2Won = true;
      } else {
        minigame2Lost = true;
      }
    }
  }

  // Third mini-game trigger: Press R near combined checkpoint (only opens, E closes)
  if (interactionKey === 'r') {
    if (nearMiniGameCheckpoint && !minigame3Open && !minigameOpen && !minigame2Open) {
      minigame3Open = true;
      minigame3ShowingInstructions = true; // Show instructions first
      minigame3Started = false;
    }
  }

  // Start game from instruction screen with SPACE or ENTER
  if (minigame3Open && minigame3ShowingInstructions && (e.code === 'Space' || e.code === 'Enter')) {
    minigame3ShowingInstructions = false;
    initMiniGame3();
    e.preventDefault();
  }

  // Third mini-game retry with T key
  if (interactionKey === 't') {
    if (minigame3Open && (minigame3Won || minigame3Lost)) initMiniGame3();
  }

  // Third mini-game shooter controls
  if (minigame3Open && minigame3Started && !minigame3ShowingInstructions && !minigame3Won && !minigame3Lost) {
    if (e.code === 'ArrowLeft' || interactionKey === 'arrowleft') {
      shooterKeys.left = true;
      e.preventDefault();
    }
    if (e.code === 'ArrowRight' || interactionKey === 'arrowright') {
      shooterKeys.right = true;
      e.preventDefault();
    }
    if (e.code === 'Space' || interactionKey === ' ') {
      e.preventDefault();
      shooterShoot();
    }
  }
});

// Collision detection against furniture
function collides(px, py) {
  if (py < 200) return true;
  if (px + player.w > desk.x && px < desk.x + desk.w && py + player.h > desk.y && py < desk.y + desk.h) return true;
  if (px + player.w > table.x && px < table.x + table.w && py + player.h > table.y && py < table.y + table.h) return true;
  return false;
}

// Game update logic
function update(dt) {
  let newX = player.x;
  let newY = player.y;

  // Movement with multiple key support for different keyboards
  if (keys['w'] || keys['KeyW'] || keys['arrowup']) newY -= player.speed;
  if (keys['s'] || keys['KeyS'] || keys['arrowdown']) newY += player.speed;
  if (keys['a'] || keys['KeyA'] || keys['arrowleft']) newX -= player.speed;
  if (keys['d'] || keys['KeyD'] || keys['arrowright']) newX += player.speed;

  if (!collides(newX, player.y)) player.x = newX;
  if (!collides(player.x, newY)) player.y = newY;

  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
  player.y = Math.max(0, Math.min(canvas.height - player.h, player.y));

  coords.textContent = `X: ${Math.round(player.x)}, Y: ${Math.round(player.y)}`;

  checkCheckpoints();

  // Animation update
  isMoving = !!(keys['w'] || keys['KeyW'] || keys['arrowup'] || 
                keys['a'] || keys['KeyA'] || keys['arrowleft'] || 
                keys['s'] || keys['KeyS'] || keys['arrowdown'] || 
                keys['d'] || keys['KeyD'] || keys['arrowright']);
  // determine horizontal direction preference
  let horiz = lastDirection;
  if ((keys['a'] || keys['KeyA'] || keys['arrowleft']) && !(keys['d'] || keys['KeyD'] || keys['arrowright'])) horiz = 'left';
  else if ((keys['d'] || keys['KeyD'] || keys['arrowright']) && !(keys['a'] || keys['KeyA'] || keys['arrowleft'])) horiz = 'right';

  // reset anim when direction changes
  if (horiz !== lastDirection) {
    lastDirection = horiz;
    animIndex = 0;
    animTimer = 0;
  }

  const currentFrames = lastDirection === 'left' ? walkLeftFrames : walkRightFrames;

  if (isMoving) {
    animTimer += dt || 16;
    if (animTimer >= animInterval) {
      animTimer -= animInterval;
      animIndex = (animIndex + 1) % currentFrames.length;
    }
  } else {
    animIndex = 0;
    animTimer = 0;
  }

  // Update mini-game timer (use dt if provided)
  if (minigameOpen && minigameStarted && !minigameWon && !minigameLost) {
    if (dt) minigameTimer -= dt/1000;
    else minigameTimer -= 1/60; // fallback
    if (minigameTimer <= 0) {
      minigameLost = true;
    }
  }

  // Update second mini-game (stabilization game)
  if (minigame2Open && minigame2Started && !minigame2Won && !minigame2Lost) {
    // Timer countdown
    if (dt) minigame2Timer -= dt/1000;
    else minigame2Timer -= 1/60;
    if (minigame2Timer <= 0) {
      minigame2Lost = true;
    }

    // Move the candy bottle if not stopped
    if (!stabStopped) {
      stabBarX += stabBarDir * stabBarSpeed;
      // Bounce at edges
      if (stabBarX >= 1) {
        stabBarX = 1;
        stabBarDir = -1;
      } else if (stabBarX <= 0) {
        stabBarX = 0;
        stabBarDir = 1;
      }
    }
  }

  // Update third mini-game (2D shooter)
  if (minigame3Open && minigame3Started && !minigame3ShowingInstructions) {
    updateShooterGame(dt);
  }
}

let discoShown = false;
function triggerDiscoEffects() {
  // Clean previous
  if (intro.parentNode) intro.remove();
  if (lights.parentNode) lights.remove();

  // Reset states
  intro.style.top = '-200px';
  intro.style.opacity = '1';

  lights.style.opacity = '0';
  lights.style.transition = 'opacity 1s';

  // Add disco ball ONLY
  document.body.appendChild(intro);

  // Force reflow
  intro.getBoundingClientRect();

  // Start falling
  intro.style.top = '20px';

  // Show lights ONLY after ball finishes falling
  setTimeout(() => {
    document.body.appendChild(lights);
    lights.style.opacity = '1';
  }, DISCO_FALL_DURATION * 1000);

  // Optional: fade everything out later
  setTimeout(() => {
    intro.style.opacity = '0';
    lights.style.opacity = '0';

    setTimeout(() => {
      intro.remove();
      lights.remove();
    }, 1000);
  }, (DISCO_FALL_DURATION + 18) * 1000);
}

      } else {
        ctx.fillStyle = '#ffff00';
        ctx.fillRect(gameX + bullet.x, gameY + bullet.y, 20, 40);
      }
    }

    // Draw player (Pikachu) - positioned at bottom of larger game area
    if (shooterPlayer.complete && shooterPlayer.naturalWidth > 0) {
      ctx.drawImage(shooterPlayer, gameX + shooterX, gameY + 460, 70, 70);
    } else {
      ctx.fillStyle = '#ffcc00';
      ctx.fillRect(gameX + shooterX, gameY + 470, 70, 60);
    }

    // HUD - Score, Goal, Timer
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(windowX + 10, windowY + 50, 150, 70);
    ctx.fillStyle = '#00ff00';
    ctx.font = 'bold 16px Arial';
    ctx.fillText('Current score: ' + minigame3Score, windowX + 20, windowY + 72);
    ctx.fillStyle = '#ffff00';
    ctx.fillText('KPI: ' + SHOOTER_WIN_SCORE + ' pts', windowX + 20, windowY + 95);
    ctx.fillStyle = minigame3Timer <= 10 ? '#ff0000' : '#ffffff';
    ctx.fillText('Time: ' + Math.ceil(minigame3Timer) + 's', windowX + 20, windowY + 118);

    // Instructions at bottom
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(windowX, windowY + windowHeight - 35, windowWidth, 35);
    ctx.fillStyle = '#aaa';
    ctx.font = '12px Arial';
    ctx.fillText('← → to move  |  SPACE to shoot  |  E to close', windowX + 160, windowY + windowHeight - 15);

    // Legend
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(windowX + windowWidth - 160, windowY + 50, 150, 50);
    ctx.fillStyle = '#ff6600';
    ctx.font = '12px Arial';
    ctx.fillText('Target (+10 pts)', windowX + windowWidth - 150, windowY + 68);
    ctx.fillStyle = '#ff0000';
    ctx.fillText('Police (instant lose!)', windowX + windowWidth - 150, windowY + 88);

    // Win message
    if (minigame3Won) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(windowX + 100, windowY + 180, 550, 120);
      ctx.strokeStyle = '#00ff00';
      ctx.lineWidth = 3;
      ctx.strokeRect(windowX + 100, windowY + 180, 550, 120);
      ctx.fillStyle = '#00ff00';
      ctx.font = 'bold 24px Arial';
      ctx.fillText('bạn đã đạt đủ KPI ngày', windowX + 200, windowY + 230);
      ctx.font = '16px Arial';
      ctx.fillStyle = 'white';
      ctx.fillText('Final Score: ' + minigame3Score, windowX + 290, windowY + 260);
      ctx.font = '14px Arial';
      ctx.fillText('Press T to try again or E to close', windowX + 230, windowY + 285);
    }

    // Lose message
    if (minigame3Lost) {
      const boxWidth = 550;
      const boxHeight = 140;
      const boxX = windowX + (windowWidth - boxWidth) / 2;
      const boxY = windowY + (windowHeight - boxHeight) / 2;
      
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
      ctx.strokeStyle = '#ff0000';
      ctx.lineWidth = 3;
      ctx.strokeRect(boxX, boxY, boxWidth, boxHeight);
      ctx.fillStyle = '#ff4444';
      ctx.font = 'bold 24px Arial';
      
      // Different messages based on lose reason
      if (minigame3LoseReason === 'police') {
        ctx.fillText('bóc lịch :<', boxX + 180, boxY + 40);
        ctx.font = '16px Arial';
        ctx.fillStyle = '#ffaaaa';
      } else if (minigame3LoseReason === 'timeout') {
        ctx.fillText('Không đạt đủ KPI :<', boxX + 135, boxY + 40);
        ctx.font = '16px Arial';
        ctx.fillStyle = '#ffaaaa';
      }
      
      ctx.font = '16px Arial';
      ctx.fillStyle = 'white';
      ctx.fillText('Final Score: ' + minigame3Score, boxX + 190, boxY + 100);
      ctx.font = '14px Arial';
      ctx.fillText('Press T to try again or E to close', boxX + 130, boxY + 125);
    }
  }
}

// Main game loop (use timestamp to compute dt)
function loop(now) {
  if (!lastTime) lastTime = now;
  const dt = now - lastTime;
  update(dt);
  draw();
  lastTime = now;
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
