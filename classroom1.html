// Analytics tracking functions
function trackPageView(pageName) {
  const key = 'analytics_' + pageName + '_views';
  const count = parseInt(localStorage.getItem(key) || '0') + 1;
  localStorage.setItem(key, count);
  logEvent('Page View', pageName);
}

function trackEvent(eventName) {
  const key = 'analytics_' + eventName + '_clicks';
  const count = parseInt(localStorage.getItem(key) || '0') + 1;
  localStorage.setItem(key, count);
  logEvent(eventName.replace('_', ' ').toUpperCase(), getCurrentPage());
}

function logEvent(action, page) {
  const eventLog = JSON.parse(localStorage.getItem('analytics_event_log') || '[]');
  eventLog.push({
    timestamp: new Date().toLocaleString(),
    action: action,
    page: page
  });
  if (eventLog.length > 100) {
    eventLog.splice(0, eventLog.length - 100);
  }
  localStorage.setItem('analytics_event_log', JSON.stringify(eventLog));
}

// Detect when player is close enough to checkpoints
function checkCheckpoints() {
  const pcx = player.x + player.w / 2;
  const pcy = player.y + player.h / 2;

  nearCheckpoint = null;
  nearTobias = false;
  nearSpeed = false;
  nearMu = false;
  nearLinhhuynh = false;
  nearLan = false;
  nearNathan = false;
  nearTobiasCheckpoint = false;
  nearMiniGame = false;
  nearMiniGame2 = false;

  // Check Jack checkpoint
  checkpoints.forEach(cp => {
    const dist = Math.hypot(pcx - (cp.x + cp.w/2), pcy - (cp.y + cp.h/2));

    if (dist < cp.triggerDistance && !cp.played) {
      nearCheckpoint = cp;
    } else if (dist >= cp.triggerDistance) {
      cp.played = false;
    }
  });

  // Check Tobias checkpoint
  const tobiasDist = Math.hypot(pcx - tobiasBurger.x, pcy - tobiasBurger.y);
  if (tobiasDist < tobiasBurger.triggerDistance && !tobiasBurger.played) {
    nearTobias = true;
  } else if (tobiasDist >= tobiasBurger.triggerDistance) {
    tobiasBurger.played = false;
  }

  // Check Speed checkpoint
  const speedDist = Math.hypot(pcx - SPpeedSound.x, pcy - SPpeedSound.y);
  if (speedDist < SPpeedSound.triggerDistance && !SPpeedSound.played) {
    nearSpeed = true;
  } else if (speedDist >= SPpeedSound.triggerDistance) {
    SPpeedSound.played = false;
  }

  // Check Mu checkpoint
  const muDist = Math.hypot(pcx - muSound.x, pcy - muSound.y);
  if (muDist < muSound.triggerDistance && !muSound.played) {
    nearMu = true;
  } else if (muDist >= muSound.triggerDistance) {
    muSound.played = false;
  }

  // Check Linh Huynh checkpoint
  const linhhuyhnhDist = Math.hypot(pcx - linhhuynh.x, pcy - linhhuynh.y);
  if (linhhuyhnhDist < linhhuynh.triggerDistance) {
    nearLinhhuynh = true;
  } else {
    nearLinhhuynh = false;
  }

  // Check Lan checkpoint
  const lanDist = Math.hypot(pcx - lan.x, pcy - lan.y);
  if (lanDist < lan.triggerDistance) {
    nearLan = true;
  } else {
    nearLan = false;
  }

  // Check Nathan checkpoint
  const nathanDist = Math.hypot(pcx - nathan.x, pcy - nathan.y);
  if (nathanDist < nathan.triggerDistance) {
    nearNathan = true;
  } else {
    nearNathan = false;
  }

  // Check Tobias checkpoint
  const tobiasDist2 = Math.hypot(pcx - tobiasCheckpoint.x, pcy - tobiasCheckpoint.y);
  if (tobiasDist2 < tobiasCheckpoint.triggerDistance) {
    nearTobiasCheckpoint = true;
  } else {
    nearTobiasCheckpoint = false;
  }

  // Check T1 checkpoint
  const t1Dist = Math.hypot(pcx - t1.x, pcy - t1.y);
  if (t1Dist < t1.triggerDistance && !t1.played) {
    nearT1 = true;
  } else if (t1Dist >= t1.triggerDistance) {
    t1.played = false;
    nearT1 = false;
  }

  // Check Mini-game checkpoint
  const miniGameDist = Math.hypot(pcx - miniGame.x, pcy - miniGame.y);
  if (miniGameDist < miniGame.triggerDistance) {
    nearMiniGame = true;
  } else {
    nearMiniGame = false;
  }

  // Check second mini-game checkpoint
  const miniGame2Dist = Math.hypot(pcx - miniGame2.x, pcy - miniGame2.y);
  if (miniGame2Dist < miniGame2.triggerDistance) {
    nearMiniGame2 = true;
  } else {
    nearMiniGame2 = false;
  }
}

// helper to pause bgMusic while a checkpoint sound plays, then resume once
let _bgResumeHandler = null;
function playCheckpointSound(sound) {
  // Stop any previously playing checkpoint sound
  if (currentCheckpointSound && !currentCheckpointSound.paused) {
    try {
      currentCheckpointSound.pause();
      currentCheckpointSound.currentTime = 0;
    } catch (e) {}
  }

  // Pause background music if needed
  const bgWasPlaying = !bgMusic.paused && !bgMusic.ended;
  if (bgWasPlaying) {
    try { bgMusic.pause(); } catch (e) {}
  }

  // Play the new checkpoint sound
  currentCheckpointSound = sound;
  try {
    sound.currentTime = 0;
  } catch (e) {}

    // Respect a preferred volume on the sound object if present, otherwise use 0.8
    try {
      sound.volume = (typeof sound._preferredVolume === 'number') ? sound._preferredVolume : 0.8;
    } catch (e) {}

  sound.play().catch(() => {});

  // Resume background music when checkpoint sound ends
  sound.onended = () => {
    currentCheckpointSound = null;
    if (musicStarted) {
      bgMusic.play().catch(() => {});
    }
  };
}

  const key = e.key.toLowerCase();
  keys[key] = true;
  keys[e.code] = true; // Also store by key code for different layouts

  // Prevent arrow keys from scrolling the page
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
    e.preventDefault();
  }

  const interactionKey = e.key.toLowerCase(); // Handle case sensitivity

  if (interactionKey === 'h') {
    if (nearCheckpoint) {
      playCheckpointSound(nearCheckpoint.sound);
      nearCheckpoint.played = true;
    }
      if (nearTobias) {
      triggerDiscoEffects();              // appears EVERY time
      playCheckpointSound(tobiasBurger.sound);

    if (nearSpeed) {
      playCheckpointSound(SPpeedSound.sound);
      SPpeedSound.played = true;
    }
    if (nearMu) {
      playCheckpointSound(muSound.sound);
      muSound.played = true;
    }
    if (nearT1) {
      playCheckpointSound(t1.sound);
      t1.played = true;
    }
  }

  if (interactionKey === 'e') {
    // Primary mini-game (near miniGame)
    if (nearMiniGame && !minigameOpen) {
      trackEvent('minigame');
      minigameOpen = true;
      initMiniGame();
    } else if (minigameOpen) {
      minigameOpen = false;
      minigameStarted = false;
    }

    // Secondary mini-game (near miniGame2)
    if (nearMiniGame2 && !minigame2Open && !minigameOpen) {
      trackEvent('minigame');
      minigame2Open = true;
      initMiniGame2();
    } else if (minigame2Open && !nearMiniGame) {
      // allow closing the second mini-game with E as well
      minigame2Open = false;
      minigame2Started = false;
    }
  }

  // Retry mini-game with T key
  if (interactionKey === 't') {
    if (minigameOpen && (minigameWon || minigameLost)) initMiniGame();
    if (minigame2Open && (minigame2Won || minigame2Lost)) initMiniGame2();
  }

  // Handle mini-game keyboard shortcuts
  if (minigameOpen && minigameStarted && !minigameWon && !minigameLost) {
    let pressedShortcut = null;

    if (e.ctrlKey) {
      if (interactionKey === 'c') pressedShortcut = 'Ctrl+C';
      else if (interactionKey === 'v') pressedShortcut = 'Ctrl+V';
    }

    if (pressedShortcut) {
      // Check if it matches the next expected shortcut
      if (pressedShortcut === minigameSequence[playerInput.length]) {
        playerInput.push(pressedShortcut);

        // Check if player completed the sequence
        if (playerInput.length === minigameSequence.length) {
          minigameWon = true;
        }
      } else {
        // Wrong shortcut - lose
        minigameLost = true;
      }
    }
  }

  // Second mini-game input: Spacebar to stabilize
  if (minigame2Open && minigame2Started && !minigame2Won && !minigame2Lost && !stabStopped) {
    if (interactionKey === ' ' || e.code === 'Space') {
      e.preventDefault();
      stabStopped = true;
      // Check if within safe zone
      if (stabBarX >= stabSafeZoneStart && stabBarX <= stabSafeZoneEnd) {
        minigame2Won = true;
      } else {
        minigame2Lost = true;
      }
    }
  }
});

// Collision detection against furniture
function collides(px, py) {
  if (py < 200) return true;
  if (px + player.w > desk.x && px < desk.x + desk.w && py + player.h > desk.y && py < desk.y + desk.h) return true;
  if (px + player.w > table.x && px < table.x + table.w && py + player.h > table.y && py < table.y + table.h) return true;
  return false;
}

// Game update logic
function update(dt) {
  let newX = player.x;
  let newY = player.y;

  // Movement with multiple key support for different keyboards
  if (keys['w'] || keys['KeyW'] || keys['arrowup']) newY -= player.speed;
  if (keys['s'] || keys['KeyS'] || keys['arrowdown']) newY += player.speed;
  if (keys['a'] || keys['KeyA'] || keys['arrowleft']) newX -= player.speed;
  if (keys['d'] || keys['KeyD'] || keys['arrowright']) newX += player.speed;

  if (!collides(newX, player.y)) player.x = newX;
  if (!collides(player.x, newY)) player.y = newY;

  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
  player.y = Math.max(0, Math.min(canvas.height - player.h, player.y));

  coords.textContent = `X: ${Math.round(player.x)}, Y: ${Math.round(player.y)}`;

  checkCheckpoints();

  // Animation update
  isMoving = !!(keys['w'] || keys['KeyW'] || keys['arrowup'] || 
                keys['a'] || keys['KeyA'] || keys['arrowleft'] || 
                keys['s'] || keys['KeyS'] || keys['arrowdown'] || 
                keys['d'] || keys['KeyD'] || keys['arrowright']);
  // determine horizontal direction preference
  let horiz = lastDirection;
  if ((keys['a'] || keys['KeyA'] || keys['arrowleft']) && !(keys['d'] || keys['KeyD'] || keys['arrowright'])) horiz = 'left';
  else if ((keys['d'] || keys['KeyD'] || keys['arrowright']) && !(keys['a'] || keys['KeyA'] || keys['arrowleft'])) horiz = 'right';

  // reset anim when direction changes
  if (horiz !== lastDirection) {
    lastDirection = horiz;
    animIndex = 0;
    animTimer = 0;
  }

  const currentFrames = lastDirection === 'left' ? walkLeftFrames : walkRightFrames;

  if (isMoving) {
    animTimer += dt || 16;
    if (animTimer >= animInterval) {
      animTimer -= animInterval;
      animIndex = (animIndex + 1) % currentFrames.length;
    }
  } else {
    animIndex = 0;
    animTimer = 0;
  }

  // Update mini-game timer (use dt if provided)
  if (minigameOpen && minigameStarted && !minigameWon && !minigameLost) {
    if (dt) minigameTimer -= dt/1000;
    else minigameTimer -= 1/60; // fallback
    if (minigameTimer <= 0) {
      minigameLost = true;
    }
  }

  // Update second mini-game (stabilization game)
  if (minigame2Open && minigame2Started && !minigame2Won && !minigame2Lost) {
    // Timer countdown
    if (dt) minigame2Timer -= dt/1000;
    else minigame2Timer -= 1/60;
    if (minigame2Timer <= 0) {
      minigame2Lost = true;
    }

    // Move the candy bottle if not stopped
    if (!stabStopped) {
      stabBarX += stabBarDir * stabBarSpeed;
      // Bounce at edges
      if (stabBarX >= 1) {
        stabBarX = 1;
        stabBarDir = -1;
      } else if (stabBarX <= 0) {
        stabBarX = 0;
        stabBarDir = 1;
      }
    }
  }
}

let discoShown = false;
function triggerDiscoEffects() {
  // Clean previous
  if (intro.parentNode) intro.remove();
  if (lights.parentNode) lights.remove();

  // Reset states
  intro.style.top = '-200px';
  intro.style.opacity = '1';

  lights.style.opacity = '0';
  lights.style.transition = 'opacity 1s';

  // Add disco ball ONLY
  document.body.appendChild(intro);

  // Force reflow
  intro.getBoundingClientRect();

  // Start falling
  intro.style.top = '20px';

  // Show lights ONLY after ball finishes falling
  setTimeout(() => {
    document.body.appendChild(lights);
    lights.style.opacity = '1';
  }, DISCO_FALL_DURATION * 1000);

  // Optional: fade everything out later
  setTimeout(() => {
    intro.style.opacity = '0';
    lights.style.opacity = '0';

    setTimeout(() => {
      intro.remove();
      lights.remove();
    }, 1000);
  }, (DISCO_FALL_DURATION + 18) * 1000);
}




// Game draw logic
function draw() {
  ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);

  // choose correct image: walking frames when moving, otherwise idle `char`
  const framesToUse = lastDirection === 'left' ? walkLeftFrames : walkRightFrames;
  const sprite = isMoving ? framesToUse[animIndex] : char;
  ctx.drawImage(sprite, player.x, player.y, player.w, player.h);

  if (nearCheckpoint) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(player.x, player.y - 30, 220, 25);
    ctx.fillStyle = 'white';
    ctx.font = '14px Arial';
    ctx.fillText('Press H to say hello to Tuan', player.x + 10, player.y - 12);
  }

  if (nearTobias) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(player.x + 50, player.y - 30, 150, 25);
    ctx.fillStyle = 'white';
    ctx.font = '14px Arial';
    ctx.fillText('press H to play music', player.x + 50, player.y - 12);
  }

  if (nearSpeed) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(player.x, player.y - 30, 260, 25);
    ctx.fillStyle = 'white';
    ctx.font = '14px Arial';
    ctx.fillText('Press H to say hello to Speed', player.x + 10, player.y - 12);
  }

  if (nearMu) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(player.x-50, player.y - 30, 210, 25);
    ctx.fillStyle = 'white';
    ctx.font = '14px Arial';
    ctx.fillText('Press H to have a conversation', player.x -40, player.y - 12);

    // Draw mu image bubble
    if (muImg.width > 0) {
      const bubbleSize = 120;
      const bubbleX = muSound.x + 20;
      const bubbleY = muSound.y - bubbleSize - 50;
      
      // Draw image inside bubble
      ctx.drawImage(muImg, bubbleX + 5, bubbleY + 5, bubbleSize - 10, bubbleSize - 10);
    }
  }

  // Draw Linh Huynh image bubble when near
  if (nearLinhhuynh && linhhuyhnhImg.width > 0) {
    const bubbleSize = 120;
    const bubbleX = 990;
    const bubbleY = 0;
    
    // Draw image inside bubble
    if (linhhuyhnhImg.width > 0) {
      ctx.drawImage(linhhuyhnhImg, bubbleX + 5, bubbleY + 5, bubbleSize - 10, bubbleSize - 10);
    }
  }

  // Draw Lan image bubble when near
  if (nearLan && lanImg.width > 0) {
    const bubbleSize = 80;
    const bubbleX = 1200;
    const bubbleY = 0;
    
    // Draw image inside bubble
    if (lanImg.width > 0) {
      ctx.drawImage(lanImg, bubbleX + 5, bubbleY + 5, bubbleSize - 10, bubbleSize - 10);
    }
  }

  // Draw Nathan image bubble when near
  if (nearNathan && nathanImg.width > 0) {
    const bubbleSize = 90;
    const bubbleX = 1290;
    const bubbleY = 0;
    
    // Draw image inside bubble
    if (nathanImg.width > 0) {
      ctx.drawImage(nathanImg, bubbleX + 5, bubbleY + 5, bubbleSize - 10, bubbleSize - 10);
    }
  }

  // Draw Tobias image bubble when near
  if (nearTobiasCheckpoint && tobiasImg.width > 0) {
    const bubbleSize = 120;
    const bubbleX = 4;
    const bubbleY = 55;
  
    // Draw image inside bubble
    if (tobiasImg.width > 0) {
      ctx.drawImage(tobiasImg, bubbleX + 5, bubbleY + 5, bubbleSize - 10, bubbleSize - 10);
    }
  }

  // Draw T1 image bubble when near
  if (nearT1 && t1Img.width > 0) {
    const bubbleSize = 120;
    const bubbleX = t1.x + 50;
    const bubbleY = t1.y - bubbleSize - 50;
    // Draw image inside bubble
    if (t1Img.width > 0) {
      ctx.drawImage(t1Img, bubbleX + 5, bubbleY + 5, bubbleSize - 10, bubbleSize - 10);
    }
  }

  // Prompt for T1 checkpoint
  if (nearT1) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(player.x - 30, player.y - 30, 165, 25);
    ctx.fillStyle = 'white';
    ctx.font = '14px Arial';
    ctx.fillText('Who ? (Press H)', player.x - 25, player.y - 12);
  }

  // Draw mini-game prompt when near
  if (nearMiniGame) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(player.x - 60, player.y - 30, 180, 25);
    ctx.fillStyle = 'white';
    ctx.font = '14px Arial';
    ctx.fillText('Press E to play mini-game 1', player.x - 50, player.y - 12);
  }

  // Draw second mini-game prompt when near
  if (nearMiniGame2) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(player.x - 60, player.y - 60, 220, 25);
    ctx.fillStyle = 'white';
    ctx.font = '14px Arial';
    ctx.fillText('Press E to play mini-game 2', player.x - 50, player.y - 42);
  }

  // Draw mini-game modal window when open
  if (minigameOpen) {
    // Dim the background
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw mini-game window
    const windowWidth = 700;
    const windowHeight = 550;
    const windowX = (canvas.width - windowWidth) / 2;
    const windowY = (canvas.height - windowHeight) / 2;

    ctx.fillStyle = '#333';
    ctx.fillRect(windowX, windowY, windowWidth, windowHeight);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.strokeRect(windowX, windowY, windowWidth, windowHeight);

    // Title bar
    ctx.fillStyle = '#555';
    ctx.fillRect(windowX, windowY, windowWidth, 40);
    ctx.fillStyle = 'white';
    ctx.font = 'bold 18px Arial';
    ctx.fillText('Assignment 1', windowX + 20, windowY + 27);

    // Close button (X)
    ctx.fillStyle = 'white';
    ctx.font = 'bold 20px Arial';
    ctx.fillText('✕', windowX + windowWidth - 30, windowY + 27);

    if (!minigameStarted) {
      // Instructions screen
      ctx.fillStyle = 'white';
      ctx.font = '16px Arial';
      ctx.fillText('Follow the sequence of keyboard shortcuts!', windowX + 30, windowY + 80);
      
      ctx.font = '14px Arial';
      ctx.fillText('Press the shortcuts in order:', windowX + 30, windowY + 130);
      
      let yOffset = 160;
      for (let i = 0; i < minigameSequence.length; i++) {
        ctx.fillText((i + 1) + '. ' + minigameSequence[i], windowX + 50, windowY + yOffset);
        yOffset += 30;
      }
      
      ctx.font = '14px Arial';
      ctx.fillStyle = '#ffff00';
      ctx.fillText('Start pressing the shortcuts!', windowX + 30, windowY + 500);
    } else {
      // Game screen
      // Instructions at top
      ctx.fillStyle = 'white';
      ctx.font = '12px Arial';
      ctx.fillText('Press the shortcuts in order. Press Ctrl+C or Ctrl+V as shown below.', windowX + 30, windowY + 65);
      ctx.fillText('You only have few seconds to complete this assignment. Try your best. Good luck!', windowX + 30, windowY + 85);

      ctx.fillStyle = 'white';
      ctx.font = '14px Arial';
      ctx.fillText('Sequence:', windowX + 30, windowY + 110);

      // Display sequence with highlighting - wraps to multiple lines
      let xOffset = 30;
      let yOffset = 140;
      const maxWidth = windowWidth - 60;
      const itemWidth = 80;
      
      for (let i = 0; i < minigameSequence.length; i++) {
        // Check if we need to wrap to next line
        if (xOffset + itemWidth > maxWidth) {
          xOffset = 30;
          yOffset += 35;
        }
        
        // Highlight current step
        if (i === playerInput.length) {
          ctx.fillStyle = '#ffff00';
        } else if (i < playerInput.length) {
          ctx.fillStyle = '#00ff00';
        } else {
          ctx.fillStyle = '#666';
        }
        
        ctx.fillText(minigameSequence[i], windowX + xOffset, windowY + yOffset);
        xOffset += itemWidth;
      }

      // Player progress
      ctx.fillStyle = 'white';
      ctx.font = '14px Arial';
      ctx.fillText('Your progress: ' + playerInput.length + '/20', windowX + 30, windowY + 380);

      // Timer
      ctx.font = 'bold 18px Arial';
      ctx.fillStyle = minigameTimer <= 5 ? '#ff0000' : '#00ff00';
      ctx.fillText('Time: ' + Math.max(0, Math.ceil(minigameTimer)) + 's', windowX + 30, windowY + 420);

      // Instructions at bottom
      ctx.fillStyle = 'white';
      ctx.font = '12px Arial';
      ctx.fillText('Press E to close', windowX + 30, windowY + 520);

      // Win message
      if (minigameWon) {
        ctx.fillStyle = 'rgba(0,255,0,0.3)';
        ctx.fillRect(windowX + 50, windowY + 250, 600, 100);
        ctx.fillStyle = '#00ff00';
        ctx.font = 'bold 24px Arial';
        ctx.fillText('Congratulations! You are ready for the industry!', windowX + 100, windowY + 310);
        ctx.font = '14px Arial';
        ctx.fillStyle = 'white';
        ctx.fillText('Press T to try again or Press E to close', windowX + 220, windowY + 380);
      }

      // Lose message
      if (minigameLost) {
        if (playerInput.length < minigameSequence.length && minigameTimer <= 0) {
          ctx.fillStyle = 'rgba(255,0,0,0.3)';
          ctx.fillRect(windowX + 10, windowY + 250, 600, 100);
          ctx.fillStyle = '#ff0000';
          ctx.font = 'bold 24px Arial';
          ctx.fillText('You missed the deadline :(', windowX + 130, windowY + 310);
        } else {
          ctx.fillStyle = 'rgba(255,0,0,0.3)';
          ctx.fillRect(windowX + 50, windowY + 250, 600, 100);
          ctx.fillStyle = '#ff0000';
          ctx.font = 'bold 24px Arial';
          ctx.fillText('You missed the deadline :(', windowX + 150, windowY + 310);
        }
        ctx.font = '14px Arial';
        ctx.fillStyle = 'white';
        ctx.fillText('Press T to try again or Press E to close', windowX + 220, windowY + 380);
      }
    }
  }

  // Draw second mini-game modal window when open
  if (minigame2Open) {
    // Dim the background slightly
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const windowWidth = 620;
    const windowHeight = 420;
    const windowX = (canvas.width - windowWidth) / 2;
    const windowY = (canvas.height - windowHeight) / 2;

    ctx.fillStyle = '#222';
    ctx.fillRect(windowX, windowY, windowWidth, windowHeight);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.strokeRect(windowX, windowY, windowWidth, windowHeight);

    // Title
    ctx.fillStyle = '#444';
    ctx.fillRect(windowX, windowY, windowWidth, 40);
    ctx.fillStyle = 'white';
    ctx.font = 'bold 18px Arial';
    ctx.fillText('Assignment 2', windowX + 20, windowY + 27);

    // Instructions - with text wrapping
    ctx.fillStyle = 'white';
    ctx.font = '14px Arial';
    const maxWidth = windowWidth - 40; // Leave margin on both sides
    
    // First instruction (broken into multiple lines)
    const instruction1 = 'Use your economics skills to keep Kera candy on the market by';
    const instruction2 = 'stabilizing the candy bottle inside the green safe zone!';
    ctx.fillText(instruction1, windowX + 20, windowY + 70);
    ctx.fillText(instruction2, windowX + 20, windowY + 90);
    
    // Second instruction
    ctx.font = '12px Arial';
    const instruction3 = 'Press SPACE to stabilize. You must stop it within the zone';
    const instruction4 = 'before time runs out.';
    ctx.fillText(instruction3, windowX + 20, windowY + 115);
    ctx.fillText(instruction4, windowX + 20, windowY + 130);

    // Draw the horizontal bar
    const barX = windowX + 40;
    const barY = windowY + 180; // Moved down to accommodate extra text lines
    const barWidth = windowWidth - 80;
    const barHeight = 50;

    // Bar background
    ctx.fillStyle = '#333';
    ctx.fillRect(barX, barY, barWidth, barHeight);
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 2;
    ctx.strokeRect(barX, barY, barWidth, barHeight);

    // Safe zone (green)
    const safeZoneX = barX + stabSafeZoneStart * barWidth;
    const safeZoneWidth = (stabSafeZoneEnd - stabSafeZoneStart) * barWidth;
    ctx.fillStyle = 'rgba(0, 255, 100, 0.6)';
    ctx.fillRect(safeZoneX, barY, safeZoneWidth, barHeight);

    // Draw the candy bottle at current position
    const bottleWidth = 40;
    const bottleHeight = 50;
    const bottleX = barX + stabBarX * (barWidth - bottleWidth);
    const bottleY = barY;

    if (keraImg.complete && keraImg.naturalWidth > 0) {
      ctx.drawImage(keraImg, bottleX, bottleY, bottleWidth, bottleHeight);
    } else {
      // Fallback: draw a simple rectangle
      ctx.fillStyle = '#ff6600';
      ctx.fillRect(bottleX, bottleY, bottleWidth, bottleHeight);
      ctx.fillStyle = '#fff';
      ctx.font = '10px Arial';
      ctx.fillText('KERA', bottleX + 5, bottleY + 30);
    }

    // Timer display
    ctx.font = 'bold 20px Arial';
    ctx.fillStyle = minigame2Timer <= 3 ? '#ff0000' : '#00ff00';
    ctx.fillText('Time: ' + Math.max(0, Math.ceil(minigame2Timer)) + 's', windowX + 20, windowY + 290);

    // Spacebar hint
    ctx.fillStyle = '#ffff00';
    ctx.font = 'bold 16px Arial';
    ctx.fillText('[ Press SPACE to Stabilize ]', windowX + 180, windowY + 310);

    // Instructions at bottom
    ctx.fillStyle = 'white';
    ctx.font = '12px Arial';
    ctx.fillText('Press E to close or Press T to retry after win/lose', windowX + 20, windowY + 390);

    // Win message
    if (minigame2Won) {
      ctx.fillStyle = 'rgba(0,255,0,0.4)';
      ctx.fillRect(windowX + 60, windowY + 130, 500, 120);
      ctx.fillStyle = '#00ff00';
      ctx.font = 'bold 22px Arial';
      ctx.fillText('ban that vjppr0 <3', windowX + 200, windowY + 185);
      ctx.font = '14px Arial';
      ctx.fillStyle = 'white';
      ctx.fillText('Press T to try again or E to close', windowX + 200, windowY + 220);
    }

    // Lose message
    if (minigame2Lost) {
      ctx.fillStyle = 'rgba(255,0,0,0.4)';
      ctx.fillRect(windowX + 60, windowY + 130, 500, 120);
      ctx.fillStyle = '#ff4444';
      ctx.font = 'bold 22px Arial';
      if (minigame2Timer <= 0) {
        ctx.fillText('Hết cứu <3', windowX + 160, windowY + 185);
      } else {
        ctx.fillText('Hết cứu <3', windowX + 190, windowY + 185);
      }
      ctx.font = '14px Arial';
      ctx.fillStyle = 'white';
      ctx.fillText('Press T to try again or E to close', windowX + 200, windowY + 220);
    }
  }
}

// Main game loop (use timestamp to compute dt)
function loop(now) {
  if (!lastTime) lastTime = now;
  const dt = now - lastTime;
  update(dt);
  draw();
  lastTime = now;
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
